const GROUPS=Object.keys(D);
const sel=document.getElementById('gf');
GROUPS.forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g;sel.appendChild(o);});

function render(){
  const q=document.getElementById('q').value.toLowerCase().trim();
  const gf=document.getElementById('gf').value;
  const out=document.getElementById('out');
  out.innerHTML='';
  let total=0;
  GROUPS.forEach(g=>{
    if(gf&&gf!==g)return;
    const words=D[g].filter(w=>!q||w[0].toLowerCase().includes(q)||w[2].toLowerCase().includes(q)||w[3].toLowerCase().includes(q));
    if(!words.length)return;
    total+=words.length;
    const block=document.createElement('div');
    block.className='group-block';
    block.innerHTML=`<div class="group-title">${g}<span class="group-badge">${words.length} words</span></div><div class="word-grid"></div>`;
    out.appendChild(block);
    const grid=block.querySelector('.word-grid');
    words.forEach(([word,pos,meaning,syns,ants,ctx])=>{
      const card=document.createElement('div');
      card.className='card';
      const st=syns.split(', ').map(s=>`<span class="tag syn">${s}</span>`).join('');
      const at=ants.split(', ').map(s=>`<span class="tag ant">${s}</span>`).join('');
      card.innerHTML=`<div class="card-head"><span class="word">${word}</span><span class="pos">${pos}</span></div><div class="meaning">${meaning}</div><div class="detail"><div class="row"><div class="label">Synonyms</div><div class="tags">${st}</div></div><div class="row"><div class="label">Antonyms</div><div class="tags">${at}</div></div><div class="row"><div class="label">GRE context</div><div class="ctx">${ctx}</div></div></div>`;
      card.addEventListener('click',()=>card.classList.toggle('open'));
      grid.appendChild(card);
    });
  });
  if(!total)out.innerHTML='<div class="no-results">No words found.</div>';
  document.getElementById('stat').textContent=total+' words';
}
render();
</script>
