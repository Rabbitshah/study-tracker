<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GRE Dashboard | Study Tracker</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..900&family=Syne:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #08080F;
            color: #e4e1ec;
            overflow-x: hidden;
        }
        .glass-card {
            background: rgba(15, 15, 26, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(30, 30, 53, 1);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            border-color: #2A2A48;
            box-shadow: 0 0 20px rgba(76, 215, 246, 0.05);
        }
        .glow-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.15;
        }
        .cyan-glow { background: #4cd7f6; width: 400px; height: 400px; }
        .violet-glow { background: #d0bcff; width: 450px; height: 450px; }
        
        .bar-chart-container {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            height: 64px;
        }
        .bar-cyan { background: #4cd7f6; width: 12px; border-radius: 2px 2px 0 0; }
        .bar-violet { background: #d0bcff; width: 12px; border-radius: 2px 2px 0 0; }
        .target-line {
            border-top: 1px dashed rgba(255, 255, 255, 0.3);
            position: absolute;
            width: 100%;
            bottom: 40px;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline": "#869397",
                        "tertiary-fixed-dim": "#ffb95f",
                        "surface-bright": "#393841",
                        "on-secondary": "#3c0091",
                        "primary-fixed-dim": "#4cd7f6",
                        "surface-container": "#1f1f27",
                        "surface-tint": "#4cd7f6",
                        "inverse-surface": "#e4e1ec",
                        "inverse-on-surface": "#303038",
                        "on-tertiary-container": "#563400",
                        "on-secondary-fixed": "#23005c",
                        "on-primary-fixed": "#001f26",
                        "on-surface": "#e4e1ec",
                        "on-primary": "#003640",
                        "on-secondary-container": "#c4abff",
                        "error": "#ffb4ab",
                        "on-tertiary-fixed": "#2a1700",
                        "error-container": "#93000a",
                        "on-background": "#e4e1ec",
                        "surface-variant": "#34343c",
                        "primary-fixed": "#acedff",
                        "on-error": "#690005",
                        "surface-container-low": "#1b1b23",
                        "on-secondary-fixed-variant": "#5516be",
                        "secondary-container": "#571bc1",
                        "primary": "#4cd7f6",
                        "secondary": "#d0bcff",
                        "outline-variant": "#3d494c",
                        "on-error-container": "#ffdad6",
                        "on-tertiary": "#472a00",
                        "surface-dim": "#13131a",
                        "on-primary-fixed-variant": "#004e5c",
                        "on-tertiary-fixed-variant": "#653e00",
                        "inverse-primary": "#00687a",
                        "primary-container": "#06b6d4",
                        "surface-container-lowest": "#0e0d15",
                        "tertiary": "#ffb95f",
                        "on-surface-variant": "#bcc9cd",
                        "secondary-fixed": "#e9ddff",
                        "on-primary-container": "#00424f",
                        "surface": "#13131a",
                        "surface-container-highest": "#34343c",
                        "background": "#13131a",
                        "tertiary-fixed": "#ffddb8",
                        "surface-container-high": "#2a2931",
                        "tertiary-container": "#e79400",
                        "secondary-fixed-dim": "#d0bcff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "unit": "4px",
                        "xl": "32px",
                        "container-margin": "24px",
                        "md": "16px",
                        "sm": "8px",
                        "lg": "24px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Syne"],
                        "display": ["Syne"],
                        "label-mono": ["JetBrains Mono"],
                        "label-caps": ["JetBrains Mono"],
                        "headline-lg": ["Syne"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Syne"]
                    },
                    "fontSize": {
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                        "display": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                        "label-mono": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "fontWeight": "700"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
</head>
<body class="font-body-md text-on-surface selection:bg-primary/30">
<!-- Ambient Background Blobs -->
<div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
<div class="glow-blob cyan-glow top-[-10%] right-[-5%]"></div>
<div class="glow-blob violet-glow bottom-[-10%] left-[-5%]"></div>
</div>
<!-- SideNavBar (Shared Component JSON) -->
<aside class="fixed left-0 top-0 h-screen w-[240px] bg-surface-container/80 backdrop-blur-xl border-r border-primary/20 shadow-xl flex flex-col py-lg z-50">
<div class="px-lg mb-xl">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary text-headline-md" style="font-variation-settings: 'FILL' 1;">school</span>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md font-bold text-primary leading-none">Study Tracker</span>
<span class="font-label-mono text-[10px] uppercase tracking-widest text-on-surface-variant">Premium GRE Prep</span>
</div>
</div>
</div>
<nav class="flex-1 space-y-xs overflow-y-auto">
<a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-variant/50 transition-colors duration-200" href="#">
<span class="material-symbols-outlined">today</span>
<span class="font-label-mono text-label-mono">Today</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-variant/50 transition-colors duration-200" href="#">
<span class="material-symbols-outlined">calendar_view_week</span>
<span class="font-label-mono text-label-mono">Weekly</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-variant/50 transition-colors duration-200" href="#">
<span class="material-symbols-outlined">inventory_2</span>
<span class="font-label-mono text-label-mono">Backlog</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-variant/50 transition-colors duration-200" href="#">
<span class="material-symbols-outlined">school</span>
<span class="font-label-mono text-label-mono">Courses</span>
</a>
<!-- Active Tab: GRE -->
<a class="flex items-center gap-3 px-4 py-3 bg-primary/10 text-primary border-l-4 border-primary transition-transform active:scale-95" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">menu_book</span>
<span class="font-label-mono text-label-mono font-bold">GRE</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-variant/50 transition-colors duration-200" href="#">
<span class="material-symbols-outlined">font_download</span>
<span class="font-label-mono text-label-mono">Word List</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:bg-surface-variant/50 transition-colors duration-200" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-mono text-label-mono">Settings</span>
</a>
</nav>
<div class="px-md mt-auto pt-lg">
<button class="w-full flex items-center justify-center gap-sm py-sm rounded-lg border border-outline-variant/30 text-on-surface-variant hover:bg-error/10 hover:text-error transition-all">
<span class="material-symbols-outlined">logout</span>
<span class="font-label-mono text-label-mono">Sign Out</span>
</button>
</div>
</aside>
<!-- Main Content Area -->
<main class="ml-[240px] min-h-screen relative">
<!-- TopAppBar (Shared Component JSON) -->
<header class="sticky top-0 z-40 w-full bg-surface/50 backdrop-blur-md border-b border-outline-variant/30 flex justify-between items-center px-lg py-sm">
<div class="flex items-center gap-md">
<h1 class="font-headline-md text-headline-md text-on-surface">GRE Dashboard</h1>
<div class="h-4 w-px bg-outline-variant/30"></div>
<div class="flex items-center gap-xs text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">calendar_today</span>
<span class="font-label-mono text-xs">Exam: September 30, 2026</span>
</div>
</div>
<div class="flex items-center gap-lg">
<div class="relative flex items-center bg-surface-container-low px-md py-xs rounded-full border border-outline-variant/20">
<span class="material-symbols-outlined text-on-surface-variant">search</span>
<input class="bg-transparent border-none focus:ring-0 text-sm text-on-surface placeholder:text-on-surface-variant/50 w-48" placeholder="Search concepts..." type="text"/>
</div>
<div class="flex items-center gap-md">
<button class="material-symbols-outlined text-on-surface-variant hover:text-primary transition-colors">notifications</button>
</div></div></header></main></body></html>
