<style>
        body {
            background-color: #08080F;
            overflow-x: hidden;
        }

        .bg-radial-glow {
            background: radial-gradient(circle at center, rgba(76, 215, 246, 0.15) 0%, rgba(208, 188, 255, 0.05) 50%, transparent 70%);
        }

        .input-glow:focus {
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
            border-color: #4cd7f6;
        }

        .primary-gradient {
            background: linear-gradient(135deg, #4cd7f6 0%, #d0bcff 100%);
        }

        .logo-gradient {
            background: linear-gradient(135deg, rgba(76, 215, 246, 0.2) 0%, rgba(208, 188, 255, 0.2) 100%);
        }

        .card-cyan-glow {
            box-shadow: 0 10px 40px -10px rgba(6, 182, 212, 0.15);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="font-body-md text-on-background min-h-screen flex items-center justify-center p-md">
<!-- Atmospheric Background Overlay -->
<div class="fixed inset-0 z-0 bg-radial-glow pointer-events-none"></div>
<main class="relative z-10 w-full max-w-[440px] flex flex-col items-center">
<!-- Header Section -->
<div class="mb-lg flex flex-col items-center text-center">
<!-- Center logo: 📚 in cyan-violet gradient rounded square (60px) -->
<div class="w-[60px] h-[60px] logo-gradient border border-primary/30 rounded-xl flex items-center justify-center mb-md card-cyan-glow">
<span class="text-[32px]">📚</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-xs">Study Tracker</h1>
<p class="font-body-md text-on-surface-variant">Track your GRE and courses in one place</p>
</div>
<!-- Auth Card -->
<!-- Card: Surface background (#0F0F1A), 16px radius, 1px border (#1E1E35), subtle cyan glow shadow -->
<div class="w-full bg-[#0F0F1A] border border-[#1E1E35] rounded-xl p-xl card-cyan-glow mb-lg">
<form action="#" class="space-y-lg" onsubmit="return false">
<!-- Email Field -->
<div class="space-y-sm">
<label class="block font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-lg py-3 pl-11 pr-md text-on-surface placeholder:text-outline/50 focus:outline-none focus:ring-0 input-glow transition-all duration-300" id="email" name="email" placeholder="name@university.edu" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-sm">
<div class="flex justify-between items-center">
<label class="block font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="font-label-caps text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-lg py-3 pl-11 pr-md text-on-surface placeholder:text-outline/50 focus:outline-none focus:ring-0 input-glow transition-all duration-300" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & Login -->
<div class="pt-sm space-y-md">
<label class="flex items-center gap-sm cursor-pointer group">
<div class="relative flex items-center">
<input class="peer h-5 w-5 rounded border-outline-variant/30 bg-surface-container-lowest text-primary-container focus:ring-primary focus:ring-offset-0 focus:ring-offset-transparent" type="checkbox"/>
</div>
<span class="font-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Remember my session</span>
</label>
<!-- Button: "Sign In" with cyan-violet gradient, 12px radius -->
<button class="w-full h-[52px] primary-gradient text-on-primary-fixed font-headline-md text-body-lg rounded-xl font-bold shadow-[0_0_20px_rgba(6,182,212,0.3)] hover:shadow-[0_0_30px_rgba(6,182,212,0.5)] active:scale-[0.98] transition-all duration-200">
                        Sign In
                    </button>
</div>
</form>
<!-- Social Login Divider -->
<div class="mt-xl flex items-center gap-md">
<div class="h-[1px] flex-1 bg-outline-variant/20"></div>
<span class="font-label-caps text-outline/40">OR CONTINUE WITH</span>
<div class="h-[1px] flex-1 bg-outline-variant/20"></div>
</div>
<div class="mt-lg grid grid-cols-2 gap-md">
<button class="flex items-center justify-center gap-sm bg-surface-container-low border border-outline-variant/20 rounded-lg py-sm hover:bg-surface-variant/40 transition-colors">
<img class="w-5 h-5" data-alt="Official high-quality logo of Google for a modern minimalist dark mode login interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB8n423TsTaII2O1ks-FhBWm0hWZwq7Px5HKYWYEfPSCahNtMawXvZTLZlq8vlzxHtb00phkvWOteVXusBwDjijs2RTMnGVuRpaB0ag1vUMPIN60sgD2P8-HBj_hRmGHCNF5RMH7krfjbpC5oKUQkh22xRdPhzlehplTqSyHuUj3TFxR775Jl6HUkUXQTz3jgjG1o8OmbyUBC8GLrra6Q9B-iF19DINzHVtyZnbxWRbDa1UjjUTATRGpseqOoPnHMaH3aDckTi3mgB7"/>
<span class="font-label-mono text-label-mono">Google</span>
</button>
<button class="flex items-center justify-center gap-sm bg-surface-container-low border border-outline-variant/20 rounded-lg py-sm hover:bg-surface-variant/40 transition-colors">
<img class="w-5 h-5" data-alt="Official high-quality logo of GitHub for a tech-focused modern dark mode developer environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDE39j2byl3pFXvWD1jTmgPzt6UoDKEfUMYYSYHtyyN1c1kFhKJAy2UaXwvgFpzLrsR_n6Khen02vOJOyMmHinSxMBR1QrfbIUQCtH40wMjXGDFk1AT4BVMcAEJZGm_2p9l51mVMCtySeIsY3B5QD22pBdgUKXKD7lSDoNOIgbsM7FMkhYIudwyiIc1gTCZY2_6dH-_9z0HCL4-n0SALs11buQKaUbMfsRWqRqUl6ZYgS1YvEmzrNlQNmgUVgl-KjOAiiQXAeVrjHtI"/>
<span class="font-label-mono text-label-mono">GitHub</span>
</button>
</div>
</div>
<!-- Footer Link -->
<p class="font-body-md text-on-surface-variant">
            Don't have an account? 
            <a class="text-primary font-bold hover:underline ml-xs" href="#">Register</a>
</p>
<!-- Dynamic Glow micro-interaction logic -->
<script>
            document.querySelectorAll('input').forEach(input => {
                input.addEventListener('focus', () => {
                    input.parentElement.parentElement.classList.add('active-focus');
                });
                input.addEventListener('blur', () => {
                    input.parentElement.parentElement.classList.remove('active-focus');
                });
            });
        </script>
</main>
<!-- Visual Accents (Atmospheric) -->
<div class="fixed top-0 right-0 w-[500px] h-[500px] bg-primary/5 rounded-full blur-[120px] -z-10 translate-x-1/2 -translate-y-1/2"></div>
<div class="fixed bottom-0 left-0 w-[500px] h-[500px] bg-secondary/5 rounded-full blur-[120px] -z-10 -translate-x-1/2 translate-y-1/2"></div>
</body></html>
